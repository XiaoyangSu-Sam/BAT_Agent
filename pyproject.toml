[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "agent-harness-baseline"
version = "0.5.0"
description = "Local coding and skills harness with OpenAI-compatible models"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "httpx>=0.27,<1",
  "PyYAML>=6,<7",
  "jsonschema>=4.23,<5",
]
[project.optional-dependencies]
notebook = ["nbclient>=0.10,<1", "nbformat>=5.10,<6", "ipykernel>=6.29,<8"]
[dependency-groups]
dev = ["pytest>=8,<10"]
[project.scripts]
agent-harness = "agent_harness.__main__:main"
[tool.hatch.build.targets.wheel]
packages = ["agent_harness"]
[tool.pytest.ini_options]
testpaths = ["agent_harness/tests"]
addopts = "-q"
